# model-proxy configuration.
#
# Unknown fields are rejected. Durations use Go syntax, e.g. "10s", "1m30s".
# Secrets are never placed directly in this file; key_env names are resolved
# from the process environment first, then from env_file.

env_file = ".env"

[server]
listen = "127.0.0.1:8080"
max_body_bytes = 1048576
read_header_timeout = "10s"
shutdown_timeout = "15s"

[logging]
format = "json"          # json | text
level = "info"           # debug | info | warn | error
log_usage = true

[auth]
enabled = true

[[virtual_keys]]
name = "laptop"
key_env = "PROXY_KEY_LAPTOP"

# Add more virtual keys as needed. Every valid key may use every alias.
# [[virtual_keys]]
# name = "ci"
# key_env = "PROXY_KEY_CI"

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
dial_timeout = "10s"
response_header_timeout = "120s"

# Optional OpenRouter app-attribution headers.
# referer = "https://example.com"
# title = "model-proxy"

[models.fast]
provider = "openrouter"
upstream = "openai/gpt-4o-mini"

[models.smart]
provider = "openrouter"
upstream = "anthropic/claude-sonnet-4"

# The model key is the alias clients send in the "model" field. It must be
# quoted if it contains dots, for example [models."gpt-4o-mini"].
